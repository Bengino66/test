<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - A1Transit</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-header">
            <img src="assets/logo.png" alt="Logo" class="logo">
        </div>
        <div class="login-content">
            <h2 style="font-weight: 700; color: #060057;">Forgot Password</h2>
            <p style="margin-bottom: 30px;">Input the email attached to your account</p>
            
            <form action="reset-password.html">
                <div class="input-field">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" placeholder="Enter your email" required>
                        <i class='bx bx-envelope' style="color: #f01d0d;"></i>
                    </div>
                </div>
                <button type="submit" class="btn-login" style="margin-top: 20px;">Send Reset Link</button>
            </form>
            
            <p class="signup-prompt" style="margin-top: 30px;">
                Go Back? <a href="login.html" style="color: #f01d0d; font-weight: 600; text-decoration: none;">Sign In</a>
            </p>
        </div>
    </div>
</body>
</html>
