<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Info - A1Transit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-header">
            <img src="assets/logo.png" alt="Logo" class="logo">
        </div>

        <div class="progress-container">
            <div class="progress-bar" style="width: 33%;"></div>
        </div>

        <div class="login-content">
            <h2>Driver Info</h2>
            <p>Complete your onboarding process</p>

            <form class="kyc-form" id="kycForm1">
                <div class="form-grid">
                    <div class="input-field">
                        <label>Vehicle Type</label>
                        <select class="standard-input" name="vehicleType" required>
                            <option value="">Select</option>
                            <option value="car">Car</option>
                            <option value="van">Van</option>
                        </select>
                    </div>
                    <div class="input-field">
                        <label>Color</label>
                        <select class="standard-input" name="color" required>
                            <option value="">Select</option>
                            <option value="red">Red</option>
                            <option value="black">Black</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="input-field">
                        <label>Model</label>
                        <select class="standard-input" name="model" required>
                            <option value="">Select</option>
                            <option value="toyota">Toyota</option>
                        </select>
                    </div>
                    <div class="input-field">
                        <label>Driving Experience</label>
                        <select class="standard-input" name="experience" required>
                            <option value="">Select</option>
                            <option value="1-3">1-3 Years</option>
                        </select>
                    </div>
                </div>

                <div class="input-field">
                    <label>Plate Number</label>
                    <input type="text" class="standard-input" placeholder="Enter plate number" required>
                </div>

                <div class="input-field">
                    <label>Driver License ID Number</label>
                    <input type="text" class="standard-input" placeholder="Enter license ID" required>
                </div>

                <div class="form-grid">
                    <div class="input-field">
                        <label>NIMC Number</label>
                        <input type="number" class="standard-input" required>
                    </div>
                    <div class="input-field">
                        <label>Date Of Birth</label>
                        <input type="date" class="standard-input" required>
                    </div>
                </div>
                 
                <div class="category-section">
                    <label>Category</label>
                    
                    <div class="category-card active" id="card-driving" onclick="selectCategory(this)">
                        <span class="radio-custom"></span>
                        Driving
                    </div>

                    <div class="category-card coming-soon-option" id="card-parcel" onclick="selectCategory(this)">
                        <span class="radio-custom"></span>
                        Parcel
                    </div>

                    <div class="category-card coming-soon-option" id="card-cargo" onclick="selectCategory(this)">
                        <span class="radio-custom"></span>
                        Cargo
                    </div>
                </div>

                <button type="submit" class="btn-login">Proceed</button>
                <div class="skip-link"><a href="index.html">Skip</a></div>
            </form>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
