<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - A1Transit</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-header">
            <img src="assets/logo.png" alt="A1Transit Logo" class="logo">
        </div>
        <div class="login-content">
            <h2 style="font-weight: 700; color: #060057; font-size: 24px; margin-top: 40px;">Reset Password</h2>
            <p style="margin-bottom: 30px; color: #333;">Enter new password</p>
            
            <form action="password-success.html">
                <div class="input-field">
                    <label>New Password</label>
                    <div class="input-wrapper">
                        <input type="password" placeholder="Enter password" required>
                        <i class='bx bx-hide toggle-password' style="color: #f01d0d;"></i>
                    </div>
                </div>

                <div class="input-field" style="margin-top: 25px;">
                    <label>Retype New Password</label>
                    <div class="input-wrapper">
                        <input type="password" placeholder="Retype password" required>
                        <i class='bx bx-hide toggle-password' style="color: #f01d0d;"></i>
                    </div>
                </div>

                <button type="submit" class="btn-login" style="margin-top: 40px;">Reset Password</button>
            </form>
            
            <p class="signup-prompt" style="margin-top: 30px;">
                Go Back? <a href="login.html" style="color: #f01d0d; font-weight: 600; text-decoration: none;">Sign In</a>
            </p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
