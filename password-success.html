<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congratulations - A1Transit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center;">
        
        <div class="login-header" style="position: absolute; top: 40px;">
            <img src="assets/logo.png" alt="A1Transit Logo" class="logo">
        </div>

        <div class="login-content" style="width: 100%; max-width: 400px; padding: 0 20px;">
            <h2 style="font-weight: 700; color: #060057; font-size: 28px; margin-bottom: 20px;">Congratulations</h2>
            
            <p style="color: #333; font-size: 18px; margin-bottom: 40px; line-height: 1.5;">
                Your password reset was successful
            </p>
            
            <button class="btn-login" onclick="window.location.href='login.html'" style="padding: 15px 40px; width: auto; min-width: 200px;">
                Back To Login
            </button>
        </div>

    </div>

</body>
</html>
