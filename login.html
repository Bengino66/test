<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - A1Transit</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-header">
            <a href="index.html">
    <img src="assets/Logo.png" alt="A1Transit Logo" class="logo">
</a>
        </div>

        <div class="login-content">
            <h2>Welcome Back</h2>
            <p>Login into your account to continue</p>

            <form id="loginForm">
                <div class="input-field">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" placeholder="Enter your email">
                        <i class='bx bx-envelope'></i>
                    </div>
                </div>

               <div class="input-field">
    <div class="label-row">
        <label>Password</label>
        <a href="forgot-password.html" class="forgot-pass">Forgot Password?</a>
    </div>
   <div class="input-wrapper">
    <input type="password" placeholder="Enter your password" required>
    <i class='bx bx-hide toggle-password'></i>
</div>
</div>      

                <button type="submit" class="btn-login">Login</button>
            </form>

            <p class="signup-prompt">Create account? <a href="signup.html">Sign Up</a></p>
        </div>
    </div>


     <script src="script.js"></script>
</body>
</html>
