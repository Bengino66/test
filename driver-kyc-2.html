<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uploads - A1Transit</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-header">
            <img src="assets/logo.png" alt="Logo" class="logo">
        </div>

        <div class="progress-container kyc-step-2">
            <div class="progress-segment active"></div>
            <div class="progress-segment active"></div>
            <div class="progress-segment"></div>
        </div>

        <div class="login-content">
            <h2>Uploads</h2>
            <p>PDFS, JPGES and PNG Formats are allowed</p>

            <form class="kyc-form">
                <div class="upload-field">
                    <label>Drivers License</label>
                    <div class="upload-zone" onclick="triggerUpload('license')">
                        <i class='bx bx-plus'></i>
                        <input type="file" id="license" hidden accept=".pdf, .jpg, .jpeg, .png">
                    </div>
                </div>

                <div class="upload-field">
                    <label>NIMC</label>
                    <div class="upload-zone" onclick="triggerUpload('nimc')">
                        <i class='bx bx-plus'></i>
                        <input type="file" id="nimc" hidden accept=".pdf, .jpg, .jpeg, .png">
                    </div>
                </div>

                <div class="button-group">
                    <button type="button" class="btn-previous" onclick="history.back()">Previous</button>
                    <button type="submit" class="btn-login" id="kyc2Next">Next</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
